name: STR Platform CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: str
          POSTGRES_PASSWORD: str_password
          POSTGRES_DB: str_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U str -d str_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres-shadow:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: str
          POSTGRES_PASSWORD: str_password
          POSTGRES_DB: str_platform_shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U str -d str_platform_shadow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://str:str_password@localhost:5432/str_platform?schema=public
      DATABASE_SHADOW_URL: postgresql://str:str_password@localhost:5433/str_platform_shadow?schema=public
      NODE_ENV: test
      AUTH_SECRET: ci-placeholder-secret-at-least-16-chars
      LOG_LEVEL: warn
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run migrations (PostgreSQL)
        run: bunx prisma migrate deploy

      - name: Seed synthetic fixtures
        run: bun run db:seed

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: str-build
          path: .next/standalone
          retention-days: 3

  e2e:
    name: Playwright E2E (RTL + LTR)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://str:str_password@localhost:5432/str_platform?schema=public
      NODE_ENV: test
      AUTH_SECRET: ci-placeholder-secret-at-least-16-chars
      LOG_LEVEL: warn
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload screenshots (G01 acceptance evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: str-e2e-screenshots
          path: tests/e2e/screenshots/
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: str-playwright-report
          path: tests/e2e/report/
          retention-days: 7
